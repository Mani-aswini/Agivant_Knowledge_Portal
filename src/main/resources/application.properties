# ===================================================================
# Internal Knowledge Portal - Application Configuration
# ===================================================================

# Server Configuration (Render dynamically injects PORT)
server.port=${PORT:${SERVER_PORT:8080}}
server.servlet.context-path=/

# MySQL Database Connection (Configurable via Environment Variables)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/knowledge_portal_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Multipart / File Upload Limits (Reject files exceeding 10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
knowledge.upload.dir=${UPLOAD_DIR:./uploads}

# AI Research Agent Configuration
# Configurable AI Provider: GEMINI (default) or OPENAI
# If AI_API_KEY is omitted, the portal operates in transparent, deterministic SIMULATION mode.
knowledge.ai.provider=${AI_PROVIDER:GEMINI}
knowledge.ai.api-key=${AI_API_KEY:}
knowledge.ai.model=${AI_MODEL_NAME:gemini-flash-lite-latest}
knowledge.ai.base-url=${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
knowledge.ai.timeout-ms=${AI_TIMEOUT_MS:30000}

