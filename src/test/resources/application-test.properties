# ===================================================================
# Isolated Integration Test Configuration (H2 In-Memory Database)
# ===================================================================

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
knowledge.upload.dir=./target/test-uploads

# Ensure tests execute in deterministic SIMULATION mode without live API key
knowledge.ai.api-key=
knowledge.ai.timeout-ms=5000
